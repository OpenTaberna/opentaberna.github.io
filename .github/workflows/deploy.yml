name: Build, verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the site and run every check
        run: ./scripts/verify.sh
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4


      - name: HTTP must redirect to HTTPS
        run: |
          for attempt in 1 2 3 4 5 6; do
            location=$(curl -sI http://opentaberna.de/ | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            [ "$location" = "https://opentaberna.de/" ] && exit 0
            sleep 10
          done
          echo "http://opentaberna.de/ redirects to '${location}', expected https://opentaberna.de/"
          exit 1
