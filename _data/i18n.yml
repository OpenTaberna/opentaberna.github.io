  faq:
    eyebrow: Fragen
    title: Bevor du uns schreibst
    items:
      - q: Ist OpenTaberna wirklich kostenlos?
        a: Ja. Jeder Teil ist Open Source unter der Apache-2.0-Lizenz. Du darfst ihn betreiben, verändern und sogar weiterverkaufen. Du zahlst uns nur, wenn du Hilfe bei Einrichtung, Hosting oder einer eigenen Storefront willst.
      - q: Was kostet das Hosting?
        a: Das hängt von der Größe deines Shops ab. Schreib uns, was du verkaufst und wie viele Bestellungen du ungefähr erwartest, und du bekommst einen festen Preis.
      - q: Kann ich später wechseln?
        a: Ja. Der Code ist offen und deine Daten liegen in einer normalen PostgreSQL-Datenbank, also kann jede Entwicklerin und jeder Entwickler übernehmen. Wenn wir deinen Shop hosten, bekommst du eine vollständige Kopie mit.
      - q: Was brauche ich, um ihn selbst zu betreiben?
        a: Einen Linux-Server mit Docker, eine Domain, ein Stripe-Konto für Zahlungen und, wenn du mit DHL versendest, ein DHL-Geschäftskundenkonto. Das Wiki führt dich durch den Rest.
      - q: Was könnt ihr für die Storefront bauen?
        a: Von der Anpassung der mitgelieferten Storefront an deine Marke bis zu einem komplett neuen Design. Beides läuft auf demselben Backoffice und derselben API.
      - q: Ist er bereit für meinen Shop?
        a: OpenTaberna ist jung. Heute deckt es Katalog, Stripe-Checkout, Bestand, Bestellungen, Retouren, DHL-Versand und Buchhaltungsbelege ab. Schreib uns, was du verkaufst, und wir sagen dir ehrlich, ob es passt.

  get_started:
    title: Erzähl uns von deinem Shop.
    text: Schreib ein paar Zeilen dazu, was du verkaufst. Wir antworten persönlich, meist innerhalb von zwei Werktagen.
