    frontend:
      subject: "OpenTaberna: custom storefront"
      body: "Hi,\n\nI would like a custom storefront for OpenTaberna.\n\nBrand / website today:\nDesigns or examples I like:\nPages and features I need:\nTimeline:\n\nBest regards\n"

  hero:
    eyebrow: Headless shop system · self-hosted · free
    title: Your own open-source shop. No licence fees. No lock-in.
    lede: OpenTaberna is a modern web shop you can run on your own server, free and open source. Or let us set it up, host it in Germany and design a storefront that looks like your brand.
    cta: Get your shop
    secondary: See what is inside
    note: Free software. You pay only for the help you want.
    shop_alt: The OpenTaberna storefront showing a product grid of wines and delicatessen with prices and "Add to bag" buttons.
    admin_alt: The OpenTaberna back office dashboard with revenue, open payments, shipments to go out and products that need restocking.

  trust:
    - icon: gift
      text: Free forever
    - icon: code
      text: Open source, Apache-2.0
    - icon: flag
      text: Hosted in Germany
    - icon: key
      text: Your data stays yours

  features:
    eyebrow: What you get
    title: Everything a shop needs. Nothing you rent.
    lede: A complete shop, not a starter kit. Storefront, checkout and back office work together, and routine work runs by itself.
    rows:
      - title: One back office for the whole shop
        text: See revenue, open payments, orders to ship and products running low at a glance. Change prices, stock and order status in one place, with separate accounts for your team.
        image: admin-dashboard.webp
        alt: The back office dashboard with net revenue, awaiting payments, outstanding shipments, stock warnings and the order mix.
        frame: admin
      - title: A storefront customers enjoy
        text: Fast product pages, a clear bag and a checkout that just works on the phone. Customers can create an account and see their orders.
        image: store-product.webp
        alt: A product page in the OpenTaberna storefront for Barolo Riserva with price and "Add to bag" button.
        frame: store
    items:
      - icon: box
        title: Catalogue and images
        text: Products with prices, images, brands and categories, ready for search engines.
      - icon: card
        title: Checkout with Stripe
        text: Card and wallet payments through Stripe, with stock reserved while customers pay.
      - icon: truck
        title: DHL shipping
        text: Paid orders become shipments and labels without typing addresses twice.
      - icon: layers
        title: Stock and returns
        text: Live stock per product, low-stock warnings and a returns process for your customers.
      - icon: receipt
        title: Documents filed for you
        text: Invoices and accounting documents land in Paperless-ngx automatically.
      - icon: user
        title: Customer accounts
        text: Secure sign-in for customers and staff, with roles for your team.

  offers:
    eyebrow: Three ways to run it
    title: Pick how much you want to do yourself.
    lede: The software is the same in every case. What changes is who does the work.
    items:
      - name: Do it yourself
        price: Free
        text: For teams with their own developer or administrator.
        points:
          - The complete shop, free and open source
          - Step-by-step documentation in the wiki
          - Runs on any Linux server with Docker
        link: https://wiki.opentaberna.de
        link_text: Read the documentation
      - name: We set it up on your server
        price: One-off price
        text: You keep the server, we do the work.
        points:
          - Installation on your server or cloud
          - Your domain, SSL, payments and shipping connected
          - Handover and a walkthrough for your team
        mail: setup
        link_text: Request a quote
      - name: We host it for you
        price: Monthly price
        text: The least effort. Hosted on our servers in Germany.
        points:
          - Servers in Germany, run by us
          - Updates, backups and monitoring included
          - Direct support from the people who build it
        mail: hosting
        link_text: Request a quote
        featured: true

  custom:
    eyebrow: Custom storefront
    title: Your brand, not a template.
    text: OpenTaberna is headless, so the storefront is completely replaceable. We design and build one that looks and feels like your brand and runs on the same back office.
    points:
      - Designed around your brand, products and customers
      - Built on the open OpenTaberna API
      - You own the code, no licence attached
    cta: Talk about your storefront
    alt: The shopping bag in the OpenTaberna storefront with three wines and an order summary.

  compare:
    eyebrow: Why not Shopware or Shopify?
    title: The same shop, without the running costs.
    columns: [OpenTaberna, Shopware, Shopify]
    rows:
      - label: Software licence
        cells:
          - Free, Apache-2.0
          - Community Edition free (MIT); paid plans from €600 a month
          - Plans from €36 a month (Basic, billed monthly)
      - label: Fees tied to your sales
        cells:
          - None
          - Paid plans are priced on your revenue; Community Edition shops above €1 million a year need a paid plan to keep Shopware Account and Store access
          - Up to 2% extra per sale if you do not use Shopify Payments
      - label: Where it runs
        cells:
          - Your server, or ours in Germany
          - Your server or Shopware's cloud
          - Shopify's cloud only
      - label: Source code
        cells:
          - Open, every component
          - Open core (Community Edition)
          - Closed
    sources_label: "Sources, as published in September 2026:"
    sources:
      - text: Shopware pricing
        url: https://www.shopware.com/en/pricing/
      - text: Shopware Fair Usage Policy
        url: https://www.shopware.com/en/news/fair-usage-policy-community-edition/
      - text: Shopify pricing
        url: https://www.shopify.com/pricing

  faq:
    eyebrow: Questions
    title: Before you write to us
    items:
      - q: Is OpenTaberna really free?
        a: Yes. Every part is open source under the Apache-2.0 licence. You can run it, change it and even sell it on. You only pay us if you want help with setup, hosting or a custom storefront.
      - q: What does hosting cost?
        a: That depends on the size of your shop. Tell us what you sell and roughly how many orders you expect, and we send you a fixed price.
      - q: Can I move away later?
        a: Yes. The code is open and your data sits in a standard PostgreSQL database, so any developer can take over. If we host your shop, you can take a full copy with you.
      - q: What do I need to run it myself?
        a: A Linux server with Docker, a domain, a Stripe account for payments and, if you ship with DHL, a DHL business account. The wiki walks you through the rest.
      - q: What can you build for the storefront?
        a: Anything from adapting the included storefront to your brand to a completely new design. Both run on the same back office and API.
      - q: Is it ready for my shop?
        a: OpenTaberna is young. Today it covers catalogue, Stripe checkout, stock, orders, returns, DHL shipping and accounting documents. Tell us what you sell and we will tell you honestly whether it fits.

  get_started:
    title: Tell us about your shop.
    text: Write a few lines about what you sell. We answer personally, usually within two working days.
    cta: Get your shop
    or: or write to

  founders:
    eyebrow: Who is behind it
    title: Built by two founders who needed it themselves.
    text: We started OpenTaberna because Shopware was expensive and hard to connect to everything we needed. Setup, hosting and custom storefronts are provided by vaultops.
    people:
