  mail:
    general:
      subject: "OpenTaberna: I would like my own shop"
      body: "Hi,\n\nI am interested in a shop built on OpenTaberna.\n\nWhat I sell:\nNumber of products:\nOrders per month (roughly):\nCurrent shop system, if any:\nTimeline:\n\nBest regards\n"
